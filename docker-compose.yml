services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sistema-bancario:latest
    container_name: sistema-bancario
    ports:
      - "8550:8550"
    environment:
      DB_PATH: /app/sistema_bancario.db
      FLET_SERVER_IP: 0.0.0.0
      FLET_SERVER_PORT: "8550"
      FLET_FORCE_WEB_SERVER: "true"
    volumes:
      # Codigo montado para poder editarlo sin reconstruir la imagen
      - .:/app
      # Base SQLite persistente en el host
      - ./sistema_bancario.db:/app/sistema_bancario.db
    restart: unless-stopped
